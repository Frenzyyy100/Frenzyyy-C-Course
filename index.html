<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>C Programming Language — Full Course</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ══ Sidebar ══ -->
<div id="sidebar">
  <div id="sidebar-header">
    <div class="sb-label">COURSE</div>
    <div class="sb-title">C Programming</div>
    <div class="sb-sub">Language Fundamentals</div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="progress-label">0 / 14 modules completed</div>
  </div>
  <div id="sidebar-search">
    <input type="text" id="search-input" placeholder="Search modules…" autocomplete="off" spellcheck="false" aria-label="Search modules"/>
  </div>
  <div id="module-list" role="navigation" aria-label="Course modules"></div>
  <div id="sidebar-footer">
    <span id="footer-modules">14 modules · C89/C99/C11</span>
    <div id="kb-hint">← → arrow keys to navigate</div>
  </div>
</div>

<!-- ══ Main ══ -->
<div id="main">
  <div id="topbar">
    <button id="toggle-btn" title="Toggle sidebar (T)" aria-label="Toggle sidebar">◀</button>
    <div id="topbar-info">
      <span id="topbar-icon" aria-hidden="true"></span>
      <div>
        <div id="topbar-title"></div>
        <div id="topbar-sub"></div>
      </div>
    </div>
    <div id="nav-btns">
      <button class="nav-btn" id="prev-btn" title="Previous module (←)" aria-label="Previous module">← Prev</button>
      <button class="nav-btn primary" id="next-btn" title="Next module (→)" aria-label="Next module">Next →</button>
    </div>
  </div>
  <div id="content" role="main">
    <div id="content-inner"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
